name: Python Test Engine

# 1. When should this pipeline run?
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    # 2. What operating system should the virtual server use?
    runs-on: ubuntu-latest

    steps:
    # 3. Download your repository's code into the GitHub server
    - name: Checkout Code
      uses: actions/checkout@v4

    # 4. Install Python 3.11
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Speeds up future runs by caching dependencies

    # 5. Install your project dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-mock  # Ensures test tools are always present

    # 6. Run the test suite you built
    - name: Run Pytest
      run: |
        pytest tests/ -v